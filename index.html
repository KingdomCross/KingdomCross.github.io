<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ed">
  <meta name="description" content="The online home of KingdomCross.">
  <title>KingdomCross | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4ed;
      --ink: #20231f;
      --muted: #686d63;
      --line: #d8d9ce;
      --green: #d5f36a;
      --coral: #ef795e;
      --mono: "DM Mono", monospace;
      --sans: "Manrope", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#25291d12 0.7px, transparent 0.7px);
      background-size: 7px 7px;
      font-family: var(--sans);
    }

    a { color: inherit; }

    .page {
      width: min(100% - 48px, 1120px);
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
    }

    .wordmark {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0;
    }

    .availability { display: flex; align-items: center; gap: 9px; color: var(--muted); }
    .availability::before { width: 8px; height: 8px; border-radius: 50%; background: #7f9b3e; content: ""; }

    main { padding-block: clamp(56px, 10vw, 112px) 64px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 340px);
      align-items: center;
      gap: clamp(40px, 9vw, 120px);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--muted);
      font: 500 12px var(--mono);
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(48px, 8.5vw, 96px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: 0;
    }

    h1 span {
      display: inline-block;
      position: relative;
      z-index: 0;
      white-space: nowrap;
    }

    h1 span::after {
      position: absolute;
      z-index: -1;
      right: -5px;
      bottom: 4px;
      left: -5px;
      height: 30%;
      background: var(--green);
      content: "";
      transform: rotate(-1.5deg);
    }

    .summary {
      max-width: 470px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }

    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

    .link-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 0 17px;
      border: 1px solid var(--ink);
      border-radius: 3px;
      background: var(--ink);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 150ms ease, color 150ms ease, transform 150ms ease;
    }

    .link-button:hover { background: transparent; color: var(--ink); transform: translateY(-2px); }
    .link-button.secondary { background: transparent; color: var(--ink); }
    .link-button.secondary:hover { background: var(--green); }
    .arrow { font-family: var(--mono); }

    .badge-frame {
      position: relative;
      padding: 20px;
      border: 1px solid var(--line);
      background: #fffefa;
      box-shadow: 7px 7px 0 var(--coral);
      transform: rotate(1.5deg);
    }

    .badge-frame img { display: block; width: 100%; height: auto; }
    .badge-caption { display: flex; justify-content: space-between; gap: 12px; margin-top: 13px; font: 11px var(--mono); color: var(--muted); }

    .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 21px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 11px var(--mono);
    }

    .bottomline a { text-decoration-thickness: 1px; text-underline-offset: 3px; }

    @media (max-width: 700px) {
      .page { width: min(100% - 36px, 520px); }
      .intro { grid-template-columns: 1fr; gap: 48px; }
      .badge-frame { width: min(100%, 340px); justify-self: center; }
      main { padding-top: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="KingdomCross home">KC / HOME</a>
      <span class="availability">A little corner of the internet</span>
    </header>

    <main id="home">
      <section class="intro" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">Hello, internet. &nbsp; / &nbsp; I’m</p>
          <h1 id="intro-title">Kingdom<span>Cross</span></h1>
          <p class="summary">A home for my projects, badges, and the things I make along the way.</p>
          <nav class="links" aria-label="Find me online">
            <a class="link-button" href="https://github.com/KingdomCross">GitHub <span class="arrow" aria-hidden="true">↗</span></a>
            <a class="link-button secondary" href="https://holopin.io/@kingdomcross">Holopin <span class="arrow" aria-hidden="true">↗</span></a>
            <a class="link-button secondary" href="https://ko-fi.com/O5O52Q5ZK">Ko-fi <span class="arrow" aria-hidden="true">↗</span></a>
          </nav>
        </div>

        <a class="badge-frame" href="https://holopin.io/@kingdomcross" aria-label="View KingdomCross's Holopin board">
          <img src="https://holopin.me/kingdomcross" alt="KingdomCross's Holopin badge board">
          <span class="badge-caption"><span>BADGES &amp; MILESTONES</span><span>01 / 01</span></span>
        </a>
      </section>
    </main>

    <footer class="bottomline">
      <span>© <span id="year"></span> KingdomCross</span>
      <a href="https://github.com/KingdomCross">Built on GitHub</a>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
